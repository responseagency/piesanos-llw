[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Nuxt 4 SSR deployment - no redirects needed as Nuxt handles routing server-side

# Environment variables should be set in Netlify UI (without VITE_ prefix for security):
# - AIRTABLE_TOKEN
# - AIRTABLE_BASE_ID
# - AIRTABLE_TABLE_NAME
# - AIRTABLE_VIEW_ID
# - AIRTABLE_LOCATIONS_TABLE_NAME
#
# Note: The old VITE_* variables are still supported as fallback during migration
